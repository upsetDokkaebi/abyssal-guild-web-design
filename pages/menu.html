<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #333;
      color: #fff;
      padding: 10px;
    }

    nav ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    nav ul li {
      display: inline;
      margin-right: 10px;
    }

    nav ul li a {
      color: #fff;
      text-decoration: none;
    }

    section {
      padding: 20px;
    }

    /* Classy Design Styles */
    .container {
      width: 800px;
      margin: 0 auto;
    }

    .box {
      background-color: #f9f9f9;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="faq.html">FAQs</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <section class="box">
      <h1>Welcome to our About page</h1>
      <p>This is the About page content.</p>
    </section>

    <section class="box">
      <h1>Welcome to our Services page</h1>
      <p>This is the Services page content.</p>
    </section>

    <section class="box">
      <h1>Welcome to our FAQs page</h1>
      <p>This is the FAQs page content.</p>
    </section>

    <section class="box">
      <h1>Welcome to our Contact Us page</h1>
      <p>This is the Contact Us page content.</p>
    </section>
  </div>
</body>
</html>
